name: build-windows

# Freezes the PrivateFirewall engine into an .exe (PyInstaller, no
# cross-compile) and compiles a signed Inno Setup installer. The exe requests
# admin via its manifest (--uac-admin) because firewall control needs elevation.
# Artifacts are downloaded and Authenticode-signed off-CI so the signing key
# never touches GitHub.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Syntax-check the engine
        run: python -m py_compile pfw/server.py pfw/config.py pfw/tray.py private_firewall_app.py

      - name: Build PrivateFirewall.exe
        run: >
          pyinstaller --onefile --windowed --name PrivateFirewall
          --icon private-firewall.ico
          --version-file packaging/version.txt
          --uac-admin
          --paths pfw
          --add-data "pfw/dashboard.html;."
          --hidden-import server
          --hidden-import config
          --hidden-import tray
          private_firewall_app.py

      - name: Stage installer inputs
        shell: pwsh
        run: |
          $stage = "packaging/staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/PrivateFirewall.exe $stage/
          Copy-Item pfw/dashboard.html $stage/ -ErrorAction SilentlyContinue
          Get-ChildItem *.ps1 | Copy-Item -Destination $stage/
          Copy-Item Install.cmd $stage/ -ErrorAction SilentlyContinue
          Copy-Item quickopen-root.crt, README.md, FEATURES.md, LICENSE $stage/ -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: private-firewall-windows
          path: |
            dist/PrivateFirewall.exe
            packaging/dist/PrivateFirewall-Setup.exe
          if-no-files-found: error
